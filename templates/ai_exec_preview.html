<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用例预览 · {{ record.name }}</title>
  <style>
    :root { --blue:#0071e3; --bg:#f5f5f7; --ink:#1d1d1f; --muted:#6e6e73; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
      background: var(--bg); color: var(--ink); line-height: 1.6; padding: 24px;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    .head {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      margin-bottom: 18px; flex-wrap: wrap;
    }
    .head h1 { font-size: 19px; font-weight: 700; word-break: break-all; }
    .meta { font-size: 13px; color: var(--muted); }
    .badge {
      display: inline-block; padding: 4px 12px; border-radius: 999px;
      background: #e8f1fc; color: var(--blue); font-size: 12px; font-weight: 700;
    }
    .content {
      background: #fff; border: 1px solid rgba(24,32,48,.09); border-radius: 16px;
      box-shadow: 0 8px 24px rgba(16,24,40,.07); padding: 22px; min-height: 240px;
    }
    pre {
      font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px;
      white-space: pre-wrap; word-break: break-word; color: var(--ink);
    }
    .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 48px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>{{ record.name }}</h1>
      <span class="meta">{{ record.ext|upper }} · {{ (record.size / 1024)|round(1) }} KB · 上传于 {{ record.created_at.strftime('%Y-%m-%d %H:%M') }}</span>
    </div>
    <span class="badge">解析内容预览</span>
    <div class="content">
      {% if record.content and not record.content.startswith('（') %}
        <pre>{{ record.content }}</pre>
      {% else %}
        <p class="empty">{{ record.content or '（该文件没有可解析的文本内容）' }}</p>
      {% endif %}
    </div>
  </div>
</body>
</html>
